name: mcce4-alpha
services:
  mcce4-alpha:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
      - USER_UID=${USER_UID}
      - USER_GID=${USER_GID}
    image: mcce4-alpha:dev
    container_name: MCCE4-Alpha
    security_opt:
      # Required for Apptainer to create user namespaces (run without root)
      - seccomp:unconfined
    devices:
      # Required for Apptainer to mount .sif images via FUSE
      - /dev/fuse
    tty: true
    volumes:
      - ../:/home/mc4/MCCE4-Alpha/
